version: 2026.232.0520
plugin-unit:
    candy:
        version: 2026.240.1900
        description: |-
            The `unit` MULTI-ROLE state-provision verb for a systemd unit FILE that has no
            cross-init analogue: a .socket, .target, .slice, or a drop-in fragment. CHECK:
            probe it through systemctl (`cat` for existence, `is-enabled` / `is-active`
            when declared). ACT: install it in ONE step - write, daemon-reload, enable.
            It exists because `service:` is deliberately init-agnostic and renders to
            supervisord, systemd or OpenRC alike, while a socket or a slice has nothing to
            render on the other two - so candies hand-roll them as `write:` plus
            `command: systemctl daemon-reload && systemctl enable`, the manual systemctl
            against a charly-managed resource R4 forbids. Named `unit`, not
            `systemd_unit`: a reserved word naming a concrete init re-creates what the
            data-driven `init:` kind eliminated, so the init is a FIELD. A host-coupled
            verb on the sdk/kit contract (CheckVerbProvider + ProvisionActor).
        plugin:
            source: github.com/opencharly/plugin-unit/candy/plugin-unit
            providers:
                - verb:unit
            primary:
                unit: unit
        plan:
            - check: the unit verb dispatches through the provider registry and probes a unit systemd itself always defines
              id: unit-verb-dispatches
              unit:
                unit: basic.target
              context: [runtime]
